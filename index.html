<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    花やしき受付
  </title>


  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    body {

      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        #f5f5f5;

      color:
        #222;

    }


    .container {

      max-width:
        700px;

      margin:
        0 auto;

      padding:
        16px;

    }


    h1 {

      text-align:
        center;

      font-size:
        24px;

      margin-bottom:
        20px;

    }


    .box {

      background:
        white;

      border-radius:
        12px;

      padding:
        16px;

      margin-bottom:
        16px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);

    }


    label {

      display:
        block;

      font-weight:
        bold;

      margin-top:
        12px;

      margin-bottom:
        5px;

    }


    input,
    textarea,
    button {

      box-sizing:
        border-box;

      width:
        100%;

      font-size:
        16px;

    }


    input,
    textarea {

      padding:
        12px;

      border:
        1px solid #ccc;

      border-radius:
        8px;

    }


    button {

      border:
        none;

      border-radius:
        9px;

      padding:
        14px;

      font-weight:
        bold;

      cursor:
        pointer;

      margin-top:
        10px;

    }


    .primary {

      background:
        #222;

      color:
        white;

    }


    .secondary {

      background:
        #e8e8e8;

      color:
        #222;

    }


    .success {

      background:
        #198754;

      color:
        white;

    }


    .status {

      padding:
        12px;

      border-radius:
        8px;

      margin:
        10px 0;

      font-weight:
        bold;

    }


    .paid {

      background:
        #e5f6ec;

      color:
        #126a3b;

    }


    .unpaid {

      background:
        #fde7e7;

      color:
        #a41313;

    }


    .cancelled {

      background:
        #fde7e7;

      color:
        #a41313;

    }


    .partial {

      background:
        #fff5d7;

      color:
        #755300;

    }


    .over {

      background:
        #ffecd5;

      color:
        #914600;

    }


    .complete {

      background:
        #e5f6ec;

      color:
        #126a3b;

    }


    .result-card {

      background:
        white;

      border:
        2px solid #ddd;

      border-radius:
        12px;

      padding:
        16px;

      margin-bottom:
        16px;

    }


    .name {

      font-size:
        23px;

      font-weight:
        bold;

      margin-bottom:
        8px;

    }


    .small {

      font-size:
        13px;

      color:
        #666;

    }


    .section-title {

      font-weight:
        bold;

      margin-top:
        18px;

      margin-bottom:
        7px;

    }


    .count-grid {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        7px;

    }


    .count-box {

      background:
        #f5f5f5;

      border-radius:
        8px;

      padding:
        10px 5px;

      text-align:
        center;

      font-size:
        13px;

    }


    .count-number {

      font-size:
        23px;

      font-weight:
        bold;

      margin-top:
        3px;

    }


    .entry-grid {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        8px;

    }


    .entry-grid label {

      font-size:
        13px;

      text-align:
        center;

    }


    #reader {

      width:
        100%;

      margin-top:
        12px;

    }


    .message {

      text-align:
        center;

      padding:
        12px;

      font-weight:
        bold;

    }


    hr {

      border:
        none;

      border-top:
        1px solid #ddd;

      margin:
        18px 0;

    }


    @media
    (max-width: 480px) {

      .count-box {

        font-size:
          12px;

      }


      .count-number {

        font-size:
          21px;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    花やしき 当日受付
  </h1>


  <!-- ======================================================
       スタッフ情報
       ====================================================== -->

  <div class="box">

    <label for="staff">
      受付担当者
    </label>


    <input
      id="staff"
      type="text"
      placeholder="例：張﨑"
    >


    <label for="pin">
      スタッフPIN
    </label>


    <input
      id="pin"
      type="password"
      inputmode="numeric"
      placeholder="PINを入力"
    >

  </div>


  <!-- ======================================================
       QR
       ====================================================== -->

  <div class="box">

    <button
      class="primary"
      onclick="startCamera()"
    >
      QRコードを読み取る
    </button>


    <button
      class="secondary"
      onclick="stopCamera()"
    >
      カメラを停止
    </button>


    <div id="reader"></div>

  </div>


  <!-- ======================================================
       手動検索
       ====================================================== -->

  <div class="box">

    <label for="searchInput">
      QRコードがない場合
    </label>


    <input
      id="searchInput"
      type="text"
      placeholder="氏名・フリガナ・受付番号"
    >


    <button
      class="primary"
      onclick="manualSearch()"
    >
      検索
    </button>

  </div>


  <div
    id="message"
    class="message"
  ></div>


  <div id="results"></div>


</div>


<script>

// ============================================================
// Apps Script WebアプリURL
// ============================================================

const API_URL =
  'https://script.google.com/macros/s/AKfycbzKfmScR6u-vgwr7EURtx8pRFpYLgsNxpOWE426v9TiZXEr9xxYaiK7bZCpAz-fKMExlA/exec';


let html5QrCode = null;

let cameraRunning = false;


// 検索結果を一時保存
const participantCache = {};


// ============================================================
// スタッフ情報
// ============================================================

function getStaffInfo() {

  const staff =
    document
      .getElementById(
        'staff'
      )
      .value
      .trim();


  const pin =
    document
      .getElementById(
        'pin'
      )
      .value
      .trim();


  if (!staff) {

    alert(
      '受付担当者名を入力してください。'
    );

    return null;

  }


  if (!pin) {

    alert(
      'スタッフPINを入力してください。'
    );

    return null;

  }


  return {

    staff:
      staff,

    pin:
      pin

  };

}


// ============================================================
// QRカメラ開始
// ============================================================

async function startCamera() {

  const info =
    getStaffInfo();


  if (!info) {

    return;

  }


  if (
    cameraRunning
  ) {

    return;

  }


  try {

    html5QrCode =
      new Html5Qrcode(
        'reader'
      );


    await html5QrCode.start(

      {
        facingMode:
          'environment'
      },

      {
        fps:
          10,

        qrbox: {

          width:
            250,

          height:
            250

        }
      },

      onScanSuccess

    );


    cameraRunning =
      true;


    showMessage(
      'QRコードをカメラにかざしてください。'
    );


  } catch (err) {

    cameraRunning =
      false;


    alert(
      'カメラを開始できませんでした。\n' +
      err
    );

  }

}


// ============================================================
// カメラ停止
// ============================================================

async function stopCamera() {

  if (
    !html5QrCode ||
    !cameraRunning
  ) {

    return;

  }


  try {

    await html5QrCode.stop();

  } catch (e) {}


  cameraRunning =
    false;

}


// ============================================================
// QR読取成功
// ============================================================

async function onScanSuccess(
  decodedText
) {

  await stopCamera();


  showMessage(
    'QRコードを読み取りました。参加者情報を検索しています。'
  );


  searchParticipant(
    decodedText
  );

}


// ============================================================
// 手動検索
// ============================================================

function manualSearch() {

  const info =
    getStaffInfo();


  if (!info) {

    return;

  }


  const query =
    document
      .getElementById(
        'searchInput'
      )
      .value
      .trim();


  if (!query) {

    alert(
      '氏名・フリガナ・受付番号を入力してください。'
    );

    return;

  }


  searchParticipant(
    query
  );

}


// ============================================================
// 参加者検索
// ============================================================

function searchParticipant(
  query
) {

  const info =
    getStaffInfo();


  if (!info) {

    return;

  }


  document
    .getElementById(
      'results'
    )
    .innerHTML =
      '';


  showMessage(
    '検索中...'
  );


  jsonp(

    {

      action:
        'search',

      query:
        query,

      pin:
        info.pin

    },


    function(data) {

      if (!data.ok) {

        showMessage(
          data.message ||
          '検索に失敗しました。'
        );

        return;

      }


      if (
        !data.results ||
        data.results.length === 0
      ) {

        showMessage(
          '該当する申込者が見つかりません。'
        );

        return;

      }


      showMessage(
        ''
      );


      renderResults(
        data.results
      );

    }

  );

}


// ============================================================
// 検索結果表示
// ============================================================

function renderResults(
  results
) {

  const area =
    document
      .getElementById(
        'results'
      );


  area.innerHTML =
    '';


  results.forEach(
    function(p) {

      participantCache[p.code] =
        p;


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'result-card';


      // ====================================================
      // 入金状況
      // ====================================================

      let paymentHtml =
        '';


      if (
        p.paymentStatus ===
        '済'
      ) {

        paymentHtml =
          `
          <div class="status paid">
            🟢 入金済
          </div>
          `;

      }

      else if (
        p.paymentStatus ===
        'キャンセル'
      ) {

        paymentHtml =
          `
          <div class="status cancelled">
            🔴 キャンセル
          </div>
          `;

      }

      else {

        paymentHtml =
          `
          <div class="status unpaid">

            🔴 未入金

            <br>

            お支払総額：
            ￥${escapeHtml(
              p.totalAmount
            )}

          </div>
          `;

      }


      // ====================================================
      // 受付状況
      // ====================================================

      let receptionClass =
        'partial';


      if (
        p.overAdult > 0 ||
        p.overElementary > 0 ||
        p.overPreschool > 0
      ) {

        receptionClass =
          'over';

      }

      else if (
        p.receptionStatus ===
        '全員受付済'
      ) {

        receptionClass =
          'complete';

      }


      const safeCode =
        escapeHtml(
          p.code
        );


      card.innerHTML =
        `

        <div class="name">
          ${escapeHtml(
            p.name
          )} 様
        </div>


        <div class="small">
          受付番号：
          ${safeCode}
        </div>


        ${paymentHtml}


        <div
          class="status ${receptionClass}"
        >

          ${escapeHtml(
            p.receptionStatus
          )}

        </div>


        <!-- ================================================
             申込人数
             ================================================ -->

        <div class="section-title">
          申込人数
        </div>


        <div class="count-grid">

          <div class="count-box">

            大人

            <div class="count-number">
              ${p.appliedAdult}
            </div>

          </div>


          <div class="count-box">

            小学生

            <div class="count-number">
              ${p.appliedElementary}
            </div>

          </div>


          <div class="count-box">

            未就学児

            <div class="count-number">
              ${p.appliedPreschool}
            </div>

          </div>

        </div>


        <!-- ================================================
             現在までの来場
             ================================================ -->

        <div class="section-title">
          現在までの来場
        </div>


        <div class="count-grid">

          <div class="count-box">

            大人

            <div class="count-number">
              ${p.checkedAdult}
            </div>

          </div>


          <div class="count-box">

            小学生

            <div class="count-number">
              ${p.checkedElementary}
            </div>

          </div>


          <div class="count-box">

            未就学児

            <div class="count-number">
              ${p.checkedPreschool}
            </div>

          </div>

        </div>


        <!-- ================================================
             残人数
             ================================================ -->

        <div class="section-title">
          申込残数
        </div>


        <div class="count-grid">

          <div class="count-box">

            大人

            <div class="count-number">
              ${p.remainingAdult}
            </div>

          </div>


          <div class="count-box">

            小学生

            <div class="count-number">
              ${p.remainingElementary}
            </div>

          </div>


          <div class="count-box">

            未就学児

            <div class="count-number">
              ${p.remainingPreschool}
            </div>

          </div>

        </div>


        ${
          (
            p.overAdult > 0 ||
            p.overElementary > 0 ||
            p.overPreschool > 0
          )
          ?
          `

          <div class="status over">

            ⚠️ 現在の超過人数

            <br>

            大人：
            ${p.overAdult}名

            ／

            小学生：
            ${p.overElementary}名

            ／

            未就学児：
            ${p.overPreschool}名

          </div>

          `
          :
          ''
        }


        ${
          p.paymentStatus ===
          'キャンセル'

          ?

          `

          <div class="status cancelled">

            キャンセル申込のため、
            受付できません。

          </div>

          `

          :

          `

          <hr>


          <!-- ==============================================
               今回来場人数
               ============================================== -->

          <div class="section-title">
            今回来場した人数
          </div>


          <div class="entry-grid">


            <div>

              <label>
                大人
              </label>

              <input

                id="adult_${safeCode}"

                type="number"

                min="0"

                max="50"

                value="0"

                inputmode="numeric"

              >

            </div>


            <div>

              <label>
                小学生
              </label>

              <input

                id="elementary_${safeCode}"

                type="number"

                min="0"

                max="50"

                value="0"

                inputmode="numeric"

              >

            </div>


            <div>

              <label>
                未就学児
              </label>

              <input

                id="preschool_${safeCode}"

                type="number"

                min="0"

                max="50"

                value="0"

                inputmode="numeric"

              >

            </div>


          </div>


          <label>
            備考（任意）
          </label>


          <input

            id="note_${safeCode}"

            type="text"

            placeholder="例：同行者2名は後から来場"

          >


          <button

            class="success"

            onclick="prepareCheckin(
              '${safeCode}'
            )"

          >

            今回分を受付する

          </button>

          `
        }

      `;


      area.appendChild(
        card
      );

    }
  );

}


// ============================================================
// 受付前準備
// ============================================================

function prepareCheckin(
  code
) {

  const participant =
    participantCache[
      code
    ];


  if (!participant) {

    alert(
      '参加者情報を取得できません。'
    );

    return;

  }


  const adult =
    Number(
      document
        .getElementById(
          'adult_' +
          code
        )
        .value ||
      0
    );


  const elementary =
    Number(
      document
        .getElementById(
          'elementary_' +
          code
        )
        .value ||
      0
    );


  const preschool =
    Number(
      document
        .getElementById(
          'preschool_' +
          code
        )
        .value ||
      0
    );


  const note =
    document
      .getElementById(
        'note_' +
        code
      )
      .value
      .trim();


  // ========================================================
  // 入力チェック
  // ========================================================

  if (
    adult === 0 &&
    elementary === 0 &&
    preschool === 0
  ) {

    alert(
      '今回入場する人数を入力してください。'
    );

    return;

  }


  const counts =
    [
      adult,
      elementary,
      preschool
    ];


  for (
    let i = 0;
    i < counts.length;
    i++
  ) {

    if (
      counts[i] < 0 ||
      !Number.isInteger(
        counts[i]
      )
    ) {

      alert(
        '人数は0以上の整数で入力してください。'
      );

      return;

    }

  }


  executeCheckin(

    participant,

    adult,

    elementary,

    preschool,

    note,

    false,

    false

  );

}


// ============================================================
// Apps Scriptへ受付登録
// ============================================================

function executeCheckin(
  participant,
  adult,
  elementary,
  preschool,
  note,
  confirmUnpaid,
  confirmOver
) {

  const info =
    getStaffInfo();


  if (!info) {

    return;

  }


  showMessage(
    '受付を登録しています...'
  );


  jsonp(

    {

      action:
        'checkin',

      code:
        participant.code,

      staff:
        info.staff,

      pin:
        info.pin,

      adult:
        adult,

      elementary:
        elementary,

      preschool:
        preschool,

      note:
        note,

      confirmUnpaid:
        confirmUnpaid
          ? 1
          : 0,

      confirmOver:
        confirmOver
          ? 1
          : 0

    },


    function(data) {

      // ====================================================
      // 未入金／超過の確認
      // ====================================================

      if (
        data.requiresConfirmation
      ) {

        let msg =
          '確認してください。\n\n';


        // 未入金
        if (
          data.unpaid
        ) {

          msg +=
            '【未入金】\n';


          msg +=
            '入金状況：' +
            (
              data.paymentStatus ||
              '未入金'
            ) +
            '\n';


          msg +=
            'お支払総額：￥' +
            data.totalAmount +
            '\n\n';

        }


        // 超過
        if (
          data.newOver
        ) {

          msg +=
            '【申込人数を超過します】\n';


          if (
            data.thisOverAdult > 0
          ) {

            msg +=
              '大人：' +
              data.thisOverAdult +
              '名超過\n';

          }


          if (
            data.thisOverElementary > 0
          ) {

            msg +=
              '小学生：' +
              data.thisOverElementary +
              '名超過\n';

          }


          if (
            data.thisOverPreschool > 0
          ) {

            msg +=
              '未就学児：' +
              data.thisOverPreschool +
              '名超過\n';

          }


          msg +=
            '\n';

        }


        msg +=
          'この内容で受付しますか？';


        const confirmed =
          window.confirm(
            msg
          );


        if (!confirmed) {

          showMessage(
            '受付をキャンセルしました。'
          );

          return;

        }


        // 確認済みとして再送
        executeCheckin(

          participant,

          adult,

          elementary,

          preschool,

          note,

          true,

          true

        );


        return;

      }


      if (!data.ok) {

        alert(
          data.message ||
          '受付に失敗しました。'
        );


        showMessage(
          '受付できませんでした。'
        );


        return;

      }


      // ====================================================
      // 完了表示
      // ====================================================

      let message =
        '受付しました。\n\n' +
        data.name +
        ' 様\n\n' +
        '現在の来場累計\n' +
        '大人：' +
        data.checkedAdult +
        '名\n' +
        '小学生：' +
        data.checkedElementary +
        '名\n' +
        '未就学児：' +
        data.checkedPreschool +
        '名';


      if (
        data.overAdult > 0 ||
        data.overElementary > 0 ||
        data.overPreschool > 0
      ) {

        message +=
          '\n\n【超過】';


        if (
          data.overAdult > 0
        ) {

          message +=
            '\n大人：' +
            data.overAdult +
            '名';

        }


        if (
          data.overElementary > 0
        ) {

          message +=
            '\n小学生：' +
            data.overElementary +
            '名';

        }


        if (
          data.overPreschool > 0
        ) {

          message +=
            '\n未就学児：' +
            data.overPreschool +
            '名';

        }

      }


      alert(
        message
      );


      showMessage(
        '受付完了'
      );


      // 最新状態に更新
      searchParticipant(
        participant.code
      );

    }

  );

}


// ============================================================
// JSONP通信
// ============================================================

function jsonp(
  params,
  callback
) {

  const callbackName =
    'jsonp_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      'script'
    );


  window[
    callbackName
  ] =
    function(data) {

      try {

        callback(
          data
        );

      }

      finally {

        try {

          delete window[
            callbackName
          ];

        }

        catch (e) {}


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }

    };


  params.callback =
    callbackName;


  const query =
    Object.keys(
      params
    )
      .map(
        function(key) {

          return (

            encodeURIComponent(
              key
            )

            +

            '='

            +

            encodeURIComponent(
              params[key]
            )

          );

        }
      )
      .join(
        '&'
      );


  script.src =
    API_URL +
    '?' +
    query;


  script.onerror =
    function() {

      showMessage(
        'サーバーとの通信に失敗しました。'
      );


      try {

        delete window[
          callbackName
        ];

      }

      catch (e) {}


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }

    };


  document.body
    .appendChild(
      script
    );

}


// ============================================================
// メッセージ表示
// ============================================================

function showMessage(
  text
) {

  document
    .getElementById(
      'message'
    )
    .textContent =
      text || '';

}


// ============================================================
// HTMLエスケープ
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
