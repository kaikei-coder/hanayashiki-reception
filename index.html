<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>花やしき受付</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #f0f2f5;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }

    h2 {
      margin: 0 0 10px;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
    }

    button {
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      color: #fff;
    }

    .btn-camera {
      background: #0d6efd;
    }

    .btn-checkin {
      background: #198754;
      font-size: 18px;
    }

    .btn-unpaid {
      background: #dc3545;
      font-size: 18px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-row input {
      flex: 1;
      min-width: 0;
    }

    .btn-search {
      min-width: 80px;
      padding: 0 15px;
      color: #fff;
      background: #6c757d;
    }

    #reader {
      display: none;
      width: 100%;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }

    .hint {
      margin-top: 8px;
      color: #666;
      font-size: 12px;
      line-height: 1.6;
    }

    .result-box {
      margin-top: 12px;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
    }

    .paid {
      color: #0f5132;
      background: #d1e7dd;
    }

    .unpaid {
      color: #842029;
      background: #f8d7da;
    }

    .checked {
      color: #664d03;
      background: #fff3cd;
    }

    .error {
      color: #842029;
      background: #f8d7da;
      border: 1px solid #f5c2c7;
    }

    .loading {
      text-align: center;
      color: #555;
    }

    .item-card {
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .person-name {
      font-size: 18px;
      font-weight: 700;
    }

    .badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 12px;
      white-space: nowrap;
    }

    .badge-paid {
      color: #0f5132;
      background: #d1e7dd;
    }

    .badge-unpaid {
      color: #842029;
      background: #f8d7da;
    }

    .badge-checked {
      color: #664d03;
      background: #fff3cd;
    }

    .detail {
      margin-top: 8px;
      color: #555;
      font-size: 14px;
      line-height: 1.7;
    }

    .select-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      color: #fff;
      background: #0d6efd;
    }

    .small {
      font-size: 12px;
      font-weight: 400;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>花やしき受付</h1>

    <label for="staffName">
      担当スタッフ名
    </label>

    <input
      id="staffName"
      type="text"
      placeholder="例：石橋"
      autocomplete="name"
    >

    <label for="staffPin">
      スタッフ用暗証番号
    </label>

    <input
      id="staffPin"
      type="password"
      inputmode="numeric"
      placeholder="スタッフ用PIN"
    >

    <button
      id="cameraBtn"
      class="btn btn-camera"
      type="button"
      onclick="toggleCamera()"
    >
      📷 カメラを起動する
    </button>

    <div id="reader"></div>

    <div class="hint">
      カメラ起動だけなら暗証番号は不要です。
      初回はブラウザからカメラ利用の確認が表示されますので、
      「許可」を選んでください。
    </div>

  </div>


  <div class="card">

    <label for="searchName">
      お名前・フリガナ・受付番号で検索
    </label>

    <div class="search-row">

      <input
        id="searchName"
        type="text"
        placeholder="例：石橋 / いしばし / 領花2026-001"
        enterkeyhint="search"
      >

      <button
        class="btn-search"
        type="button"
        onclick="searchParticipant()"
      >
        検索
      </button>

    </div>

  </div>


  <div id="resultArea"></div>

</div>


<script>

  // =====================================================
  // 後でApps ScriptのWebアプリURLに差し替えます
  // =====================================================
  const API_URL =
    'PASTE_APPS_SCRIPT_WEB_APP_URL_HERE';


  let html5QrCode = null;
  let isScanning = false;
  let currentCode = '';


  window.addEventListener(
    'load',
    function () {

      const savedStaff =
        localStorage.getItem(
          'hanayashikiStaffName'
        );

      if (savedStaff) {
        document.getElementById(
          'staffName'
        ).value = savedStaff;
      }


      document
        .getElementById(
          'searchName'
        )
        .addEventListener(
          'keydown',
          function (e) {

            if (e.key === 'Enter') {
              e.preventDefault();
              searchParticipant();
            }

          }
        );
    }
  );


  function escapeHtml(value) {

    return String(
      value ?? ''
    )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );
  }


  function getStaffNameOnly() {

    const staff =
      document
        .getElementById(
          'staffName'
        )
        .value
        .trim();


    if (!staff) {

      alert(
        '担当スタッフ名を入力してください。'
      );

      return null;
    }


    localStorage.setItem(
      'hanayashikiStaffName',
      staff
    );


    return staff;
  }


  function getStaffInfo() {

    const staff =
      getStaffNameOnly();


    if (!staff) {
      return null;
    }


    const pin =
      document
        .getElementById(
          'staffPin'
        )
        .value
        .trim();


    if (!pin) {

      alert(
        'スタッフ用暗証番号を入力してください。'
      );

      return null;
    }


    return {
      staff: staff,
      pin: pin
    };
  }


  function checkApiUrl() {

    if (
      !API_URL ||
      API_URL.includes(
        'PASTE_APPS_SCRIPT'
      )
    ) {

      alert(
        'まだGoogle Apps Scriptとの接続設定が完了していません。'
      );

      return false;
    }

    return true;
  }


  async function toggleCamera() {

    const staff =
      getStaffNameOnly();


    if (!staff) {
      return;
    }


    if (isScanning) {

      await stopCamera();

      return;
    }


    if (
      typeof Html5Qrcode ===
      'undefined'
    ) {

      alert(
        'QRコード読み取り機能の読み込みに失敗しました。ページを再読み込みしてください。'
      );

      return;
    }


    const reader =
      document.getElementById(
        'reader'
      );

    reader.style.display =
      'block';


    try {

      html5QrCode =
        new Html5Qrcode(
          'reader'
        );


      await html5QrCode.start(

        {
          facingMode:
            'environment'
        },

        {
          fps: 10,

          qrbox: function (
            width,
            height
          ) {

            const min =
              Math.min(
                width,
                height
              );

            const size =
              Math.floor(
                Math.min(
                  260,
                  min * 0.8
                )
              );

            return {
              width: size,
              height: size
            };
          }
        },

        onScanSuccess,

        function () {
        }

      );


      isScanning =
        true;


      const btn =
        document.getElementById(
          'cameraBtn'
        );


      btn.textContent =
        '⏹️ カメラを停止する';


      btn.style.background =
        '#6c757d';


    } catch (err) {

      reader.style.display =
        'none';


      const message =
        String(err || '');


      if (
        message.includes(
          'NotAllowedError'
        ) ||
        message.includes(
          'Permission denied'
        )
      ) {

        alert(
          'カメラの利用がブラウザで拒否されています。\n\n' +
          'Safari / Chrome のサイト設定で、このページの「カメラ」を「許可」にしてください。\n\n' +
          '詳細: ' +
          message
        );

      } else {

        alert(
          'カメラの起動に失敗しました。\n\n' +
          message
        );

      }

    }
  }


  async function stopCamera() {

    try {

      if (
        html5QrCode &&
        isScanning
      ) {

        await html5QrCode.stop();

      }

    } catch (e) {

      console.error(e);

    }


    isScanning =
      false;


    document
      .getElementById(
        'reader'
      )
      .style
      .display =
      'none';


    const btn =
      document.getElementById(
        'cameraBtn'
      );


    btn.textContent =
      '📷 カメラを起動する';


    btn.style.background =
      '#0d6efd';
  }


  function onScanSuccess(
    decodedText
  ) {

    const code =
      String(
        decodedText || ''
      ).trim();


    if (!code) {
      return;
    }


    if (
      code === currentCode
    ) {
      return;
    }


    currentCode =
      code;


    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        100
      );
    }


    searchByQuery(
      code
    );
  }


  function searchParticipant() {

    const query =
      document
        .getElementById(
          'searchName'
        )
        .value
        .trim();


    if (!query) {

      alert(
        'お名前・フリガナ・受付番号を入力してください。'
      );

      return;
    }


    currentCode =
      '';


    searchByQuery(
      query
    );
  }


  function searchByQuery(
    query
  ) {

    if (!checkApiUrl()) {
      return;
    }


    const staffInfo =
      getStaffInfo();


    if (!staffInfo) {
      return;
    }


    showLoading(
      '検索中...'
    );


    jsonpRequest(
      {
        action:
          'search',

        query:
          query,

        pin:
          staffInfo.pin
      },

      function (response) {

        if (
          !response ||
          response.ok !== true
        ) {

          showError(
            response &&
            response.message
              ? response.message
              : '検索に失敗しました。'
          );

          return;
        }


        renderResults(
          response.results || []
        );
      }

    );
  }


  function jsonpRequest(
    params,
    callback
  ) {

    const callbackName =
      'jsonp_' +
      Date.now() +
      '_' +
      Math.floor(
        Math.random() *
        100000
      );


    params.callback =
      callbackName;


    const url =
      API_URL +
      '?' +
      new URLSearchParams(
        params
      ).toString();


    const script =
      document.createElement(
        'script'
      );


    let finished =
      false;


    window[
      callbackName
    ] =
      function (data) {

        finished =
          true;


        cleanup();


        callback(
          data
        );
      };


    function cleanup() {

      try {

        delete window[
          callbackName
        ];

      } catch (e) {
      }


      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }

    }


    script.onerror =
      function () {

        if (finished) {
          return;
        }


        cleanup();


        showError(
          'Google Apps Scriptとの通信に失敗しました。'
        );
      };


    setTimeout(
      function () {

        if (finished) {
          return;
        }


        cleanup();


        showError(
          '通信がタイムアウトしました。もう一度お試しください。'
        );

      },
      15000
    );


    script.src =
      url;


    document.body.appendChild(
      script
    );
  }


  function renderResults(
    list
  ) {

    const area =
      document.getElementById(
        'resultArea'
      );


    if (
      !Array.isArray(
        list
      ) ||
      list.length === 0
    ) {

      area.innerHTML =
        '<div class="card error">' +
        '<strong>該当する参加者が見つかりません。</strong>' +
        '</div>';

      return;
    }


    if (
      list.length === 1
    ) {

      renderSingle(
        list[0]
      );

      return;
    }


    let html =
      '<div class="card">' +
      '<h2>該当者が ' +
      list.length +
      ' 件見つかりました</h2>';


    list.forEach(
      function (data) {

        let badge =
          '';


        if (
          data.checkinTime
        ) {

          badge =
            '<span class="badge badge-checked">' +
            '受付済 ' +
            escapeHtml(
              data.checkinTime
            ) +
            '</span>';

        }

        else if (
          data.mStatus ===
          '済'
        ) {

          badge =
            '<span class="badge badge-paid">' +
            '入金済' +
            '</span>';

        }

        else {

          badge =
            '<span class="badge badge-unpaid">' +
            '未入金' +
            '</span>';

        }


        html +=

          '<div class="item-card">' +

          '<div class="item-top">' +

          '<div class="person-name">' +

          escapeHtml(
            data.name
          ) +

          ' 様' +

          (
            data.kana
              ?
              ' (' +
              escapeHtml(
                data.kana
              ) +
              ')'
              :
              ''
          ) +

          '</div>' +

          badge +

          '</div>' +


          '<div class="detail">' +

          '受付番号：' +
          escapeHtml(
            data.code
          ) +
          '<br>' +

          '大人：' +
          escapeHtml(
            data.adultCount
          ) +
          '名 / ' +

          '小学生：' +
          escapeHtml(
            data.childCount
          ) +
          '名<br>' +

          '請求額：￥' +
          escapeHtml(
            data.totalAmount
          ) +
          '-' +

          '</div>' +


          '<button ' +
          'class="select-btn" ' +
          'type="button" ' +
          'data-code="' +
          escapeHtml(
            data.code
          ) +
          '">' +

          'この方を選択して受付' +

          '</button>' +

          '</div>';

      }
    );


    html +=
      '</div>';


    area.innerHTML =
      html;


    area
      .querySelectorAll(
        '.select-btn'
      )
      .forEach(
        function (button) {

          button.addEventListener(
            'click',
            function () {

              searchByQuery(
                this.dataset.code
              );

            }
          );

        }
      );
  }


  function renderSingle(
    data
  ) {

    currentCode =
      String(
        data.code || ''
      );


    let status =
      '';


    let button =
      '';


    if (
      data.checkinTime
    ) {

      status =

        '<div class="result-box checked">' +

        '⚠️ 既に受付済みです<br>' +

        '受付時刻：' +

        escapeHtml(
          data.checkinTime
        ) +

        '</div>';

    }

    else if (
      data.mStatus ===
      '済'
    ) {

      status =

        '<div class="result-box paid">' +

        '✅ 入金済み（受付OK）' +

        '</div>';


      button =

        '<button ' +
        'id="checkinBtn" ' +
        'class="btn btn-checkin" ' +
        'type="button">' +

        '受付を確定する' +

        '</button>';

    }

    else {

      status =

        '<div class="result-box unpaid">' +

        '⚠️ 未入金です<br>' +

        'お支払額：￥' +

        escapeHtml(
          data.totalAmount
        ) +

        '-<br>' +

        '<span class="small">' +

        '後日振込をご案内してから受付してください。' +

        '</span>' +

        '</div>';


      button =

        '<button ' +
        'id="checkinBtn" ' +
        'class="btn btn-unpaid" ' +
        'type="button">' +

        '振込案内完了 ＆ 受付確定' +

        '</button>';
    }


    document
      .getElementById(
        'resultArea'
      )
      .innerHTML =

      '<div class="card">' +

      '<h2>' +

      escapeHtml(
        data.name
      ) +

      ' 様' +

      (
        data.kana
          ?
          ' (' +
          escapeHtml(
            data.kana
          ) +
          ')'
          :
          ''
      ) +

      '</h2>' +


      '<div class="detail">' +

      '<strong>受付番号：</strong>' +

      escapeHtml(
        data.code
      ) +

      '<br>' +


      '<strong>内訳：</strong>' +

      '大人 ' +

      escapeHtml(
        data.adultCount
      ) +

      '名 / 小学生 ' +

      escapeHtml(
        data.childCount
      ) +

      '名<br>' +


      '<strong>請求額：</strong>￥' +

      escapeHtml(
        data.totalAmount
      ) +

      '-' +

      '</div>' +

      status +

      button +

      '</div>';


    const checkinBtn =
      document.getElementById(
        'checkinBtn'
      );


    if (
      checkinBtn
    ) {

      checkinBtn.addEventListener(
        'click',
        function () {

          executeCheckin(
            data.code
          );

        }
      );
    }
  }


  function executeCheckin(
    code
  ) {

    if (!checkApiUrl()) {
      return;
    }


    const staffInfo =
      getStaffInfo();


    if (!staffInfo) {
      return;
    }


    showLoading(
      '受付登録中...'
    );


    jsonpRequest(
      {

        action:
          'checkin',

        code:
          code,

        staff:
          staffInfo.staff,

        pin:
          staffInfo.pin

      },

      function (
        response
      ) {

        if (
          !response ||
          response.ok !== true
        ) {

          showError(
            response &&
            response.message
              ?
              response.message
              :
              '受付登録に失敗しました。'
          );

          return;
        }


        if (
          response.alreadyCheckedIn
        ) {

          document
            .getElementById(
              'resultArea'
            )
            .innerHTML =

            '<div class="card">' +

            '<div class="result-box checked">' +

            '⚠️ 既に受付済みです<br>' +

            escapeHtml(
              response.name
            ) +

            ' 様<br>' +

            '受付時刻：' +

            escapeHtml(
              response.checkinTime || ''
            ) +

            '</div>' +

            '</div>';

        }

        else {

          document
            .getElementById(
              'resultArea'
            )
            .innerHTML =

            '<div class="card" style="text-align:center;">' +

            '<h2 style="color:#198754;">' +

            '✅ 受付完了' +

            '</h2>' +

            '<p style="font-size:20px;font-weight:700;">' +

            escapeHtml(
              response.name
            ) +

            ' 様' +

            '</p>' +

            '<p>' +

            '対応：' +

            escapeHtml(
              response.staff
            ) +

            '</p>' +

            '</div>';
        }


        currentCode =
          '';
      }
    );
  }


  function showLoading(
    text
  ) {

    document
      .getElementById(
        'resultArea'
      )
      .innerHTML =

      '<div class="card loading">' +

      escapeHtml(
        text
      ) +

      '</div>';
  }


  function showError(
    message
  ) {

    document
      .getElementById(
        'resultArea'
      )
      .innerHTML =

      '<div class="card error">' +

      '<strong>エラー</strong><br><br>' +

      escapeHtml(
        message
      ) +

      '</div>';
  }

</script>

</body>
</html>
